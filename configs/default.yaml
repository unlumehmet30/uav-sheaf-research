# Base episode configuration (test conditions override individual fields; the training
# mixture in src/graph/dataset.py:sample_train_config randomises over the *seen* conditions).
episode:
  swarm:
    n_uavs: 10
    n_steps: 100
    dt: 0.5
    trajectory: random_turn
    formation: circle
    spacing: 12.0
    breathing: 0.35
    leader_speed: [3.0, 7.0]
    kp: 1.2
    kd: 2.0
    a_max: 4.0
    wind_std: 0.3
    comm_range: 30.0
  sensors:
    gnss_sigma: 1.0
    rel_sigma: 0.3
    vel_sigma: 0.2
    noise_scale: 1.0
  anomaly:
    kind: mixed
    n_anomalous: [1, 2]
    p_anomaly_free: 0.2
    onset_frac: [0.25, 0.5]
    sudden_mag: [4.0, 12.0]
    drift_rate: [0.2, 0.6]
    spoof_mag: [6.0, 15.0]
    spoof_ramp: 10
    spoof_group: [1, 3]
    spoof_jitter: 0.3
    label_min_offset: 2.0
  channel:
    loss_model: iid
    loss_rate: 0.0
    mean_burst: 5.0
    targeted_loss: 0.0
  blockage_rate: 0.0

data:
  n_train: 200            # training episodes per seed (mixture of conditions)
  n_val: 60               # validation episodes per seed (same mixture; used for early stopping + operating point)
  n_test_per_condition: 40

train:
  epochs: 30
  batch_size: 16
  lr: 0.003               # default; per-model learning rates come from configs/tuned_lr.yaml if present
  weight_decay: 1.0e-5
  grad_clip: 1.0
  patience: 6
  pos_weight_max: 10.0
  threads: 1

experiment:
  seeds: [0, 1, 2, 3, 4]
  target_fpr: 0.05        # operating point fixed on the validation split
  tuning_seed: 9          # disjoint from the evaluation seeds; tuning uses split 'tune' only
  lr_grid: [0.001, 0.003, 0.01]   # 0.03 was added afterwards because the optimum sat on the grid edge (see results/tables/tuning.csv)
